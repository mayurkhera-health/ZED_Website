# PRODUCTION — the site customers see.
#
#   fly deploy -c fly.production.toml
#
# Only deploy a commit here that is already running on staging. That is the
# whole point of having two.
#
# BEFORE THE FIRST DEPLOY, set the app name below. `fly apps create <name>`
# first; the name must be globally unique across Fly.

app = "zedventures-production"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_SITE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  
  # ONLY allow traffic originating from Cloudflare's IPv4 & IPv6 Ranges
  allowed_public_ips = [
    "103.21.244.0/22", "103.22.200.0/22", "103.31.4.0/22", "141.101.64.0/18",
    "172.64.0.0/13", "173.245.48.0/20", "188.114.96.0/20", "190.93.240.0/20",
    "197.234.240.0/22", "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
    "104.24.0.0/14", "172.68.0.0/15", "131.0.72.0/22",
    "2400:cb00::/32", "2606:4700::/32", "2803:f800::/32", "2405:b500::/32",
    "2405:8100::/32", "2a06:98c0::/29", "2c0f:f248::/32"
  ]

[http_service.concurrency]
  type = "requests"
  soft_limit = 200
  hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
