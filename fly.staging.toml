# STAGING — a deployed copy that matches production and that nobody real visits.
#
#   fly deploy -c fly.staging.toml
#
# There is deliberately no plain fly.toml in this repo. A bare `fly deploy`
# fails with "Could not find a fly.toml" rather than guessing an app, because
# guessing is how a staging change reaches a production site.

app = "zedventures-test"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"
  # Baked into the bundle at build time. Everything that is not "production"
  # emits noindex and shows a corner badge — see src/lib/site-env.ts.
  [build.args]
    VITE_SITE_ENV = "staging"

[http_service]
 internal_port = 3000 
force_https = true 

# Turn off scaling to zero so the app stays awake permanently
auto_stop_machines = "off" 
auto_start_machines = true 
min_machines_running = 1


  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
